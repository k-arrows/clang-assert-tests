
name: Clang Assertion Failure Test Cases

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      CMAKE_VERSION: "3.31.10"
      LLVM_SRC: ${{ github.workspace }}/llvm-project
      LLVM_BUILD: ${{ github.workspace }}/llvm-project/build
      LLVM_INSTALL: ${{ github.workspace }}/llvm-install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CMake build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            curl \
            build-essential \
            libssl-dev

      - name: Build CMake
        run: |
          curl -L \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}.tar.gz" \
            -o cmake.tar.gz

          tar xf cmake.tar.gz
          cd "cmake-${CMAKE_VERSION}"

          ./bootstrap --prefix="$HOME/cmake"
          make -j4
          make install

          echo "$HOME/cmake/bin" >> "$GITHUB_PATH"

      - name: Install LLVM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            ca-certificates \
            git \
            clang \
            libomp-dev \
            ninja-build \
            python3 \
            build-essential \
            curl \
            xz-utils \
            file

      - name: Checkout LLVM
        run: |
          git clone --depth 1 \
            https://github.com/llvm/llvm-project.git \
            "$LLVM_SRC"

          echo "LLVM revision:"
          git -C "$LLVM_SRC" rev-parse HEAD

      - name: Patch CIR TableGen dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cmake_file = Path(
              "$LLVM_SRC/clang/lib/CIR/Dialect/Transforms/"
              "TargetLowering/CMakeLists.txt"
          )

          # GitHub Actions expression is not expanded inside Python.
          import os
          cmake_file = Path(os.environ["LLVM_SRC"]) / (
              "clang/lib/CIR/Dialect/Transforms/"
              "TargetLowering/CMakeLists.txt"
          )

          content = cmake_file.read_text()

          old = """  DEPENDS
            clangBasic
            mlir-headers
          """

          new = """  DEPENDS
            clangBasic
            mlir-headers
            MLIRCIRPassIncGen
          """

          if "MLIRCIRPassIncGen" in content:
              print("Dependency already exists. Skipping patch.")
          elif old in content:
              cmake_file.write_text(content.replace(old, new, 1))
              print("Successfully added MLIRCIRPassIncGen.")
          else:
              raise RuntimeError(
                  "Could not find the expected DEPENDS section."
              )
          PY

          echo "Patched CMakeLists.txt:"
          cat "$LLVM_SRC/clang/lib/CIR/Dialect/Transforms/TargetLowering/CMakeLists.txt"

      - name: Configure LLVM
        run: |
          cmake -S "$LLVM_SRC/llvm" \
                -B "$LLVM_BUILD" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$LLVM_INSTALL" \
                -DLLVM_TARGETS_TO_BUILD=host \
                -DLLVM_INSTALL_UTILS=ON \
                -DCMAKE_CXX_STANDARD=17 \
                -DLLVM_ENABLE_WERROR=OFF \
                -DBUILD_SHARED_LIBS=ON \
                -DLLVM_ENABLE_ASSERTIONS=ON \
                -DLLVM_ENABLE_LIBCXX=ON \
                -DLLVM_ENABLE_PROJECTS="llvm;clang;mlir" \
                -DLLVM_ENABLE_RUNTIMES=openmp \
                -DLLVM_LIT_ARGS="-v -vv" \
                -DCMAKE_C_COMPILER=/usr/bin/clang \
                -DCMAKE_CXX_COMPILER=/usr/bin/clang++

      - name: Build and install LLVM
        run: |
          cmake --build "$LLVM_BUILD" \
                --target install \
                --parallel 4

      - name: Show Clang version
        run: |
          "$LLVM_INSTALL/bin/clang" --version

      - name: Run tests
        run: |
          export PATH="$LLVM_INSTALL/bin:$PATH"
          export LD_LIBRARY_PATH="$LLVM_INSTALL/lib:${LD_LIBRARY_PATH:-}"

          python3 scripts/check_all.py

